name = "startbiz"
compatibility_date = "2026-09-25"

# Static CRA build. Physical prerendered HTML shells (build/**/index.html) win for
# crawlers; SPA fallback covers any remaining client routes. Do NOT add
# public/_redirects with `/* /index.html 200`.
[assets]
directory = "./build"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
